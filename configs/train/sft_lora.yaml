data_path: data/sft.jsonl
output_dir: outputs/sft-lora
max_steps: 500
micro_batch_size: 2
grad_accum_steps: 8
lr: 1.0e-4
min_lr: 1.0e-5
warmup_steps: 50
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
eps: 1.0e-8
grad_clip: 1.0
dtype: bfloat16
log_interval: 10
save_interval: 250
seed: 42
num_workers: 2
lora: true
lora_r: 8
lora_alpha: 16.0
