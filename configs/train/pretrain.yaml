data_path: data/train.jsonl
output_dir: outputs/pretrain
max_steps: 1000
micro_batch_size: 2
grad_accum_steps: 8
lr: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 100
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
eps: 1.0e-8
grad_clip: 1.0
dtype: bfloat16
log_interval: 10
save_interval: 500
seed: 42
num_workers: 2
