[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmforge"
version = "0.1.0"
description = "Trainable, scalable decoder-only LLM framework"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pyyaml",
    "transformers>=4.44",
    "datasets",
    "safetensors",
    "tqdm",
]

[project.optional-dependencies]
train = ["wandb"]

[tool.setuptools.packages.find]
include = ["lmforge*"]
